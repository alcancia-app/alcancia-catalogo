# Cada receta nueva se valida con el código de Alcancía y se revisa que no traiga datos personales.
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recetas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: alcancia-app/alcancia, path: _alcancia }
      - name: Validar recetas
        run: ALCANCIA=_alcancia python3 herramientas/revisar.py
